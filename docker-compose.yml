# Local development infrastructure only. Not a deployment artifact.
# Both services are published on 127.0.0.1 so they are not reachable from the
# network. Values come from .env; copy .env.example to .env to override them.

services:
  postgres:
    image: postgres:18-alpine
    container_name: timenator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timenator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timenator}
      POSTGRES_DB: ${POSTGRES_DB:-timenator}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready returns 0 only once the server accepts connections, which is
      # later than the container being up: initdb runs on the first start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timenator} -d ${POSTGRES_DB:-timenator}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: timenator-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      # Redis holds only presence and cached leaderboards, both recomputable,
      # so this volume is a convenience across restarts, not durable storage.
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
