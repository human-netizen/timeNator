name: Release

# Pushing a tag such as v1.0.0 builds the desktop client and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The API tests need Linux containers, which Windows runners lack; CI runs them on every push.
      - name: Test
        run: dotnet test tests/TimeNator.Desktop.Tests -c Release

      - name: Publish
        run: dotnet publish src/TimeNator.Desktop -p:PublishProfile=win-x64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "TimeNator-$env:TAG-win-x64.exe"
          Copy-Item src/TimeNator.Desktop/bin/publish/win-x64/TimeNator.Desktop.exe $exe
          gh release create $env:TAG $exe --title "TimeNator $env:TAG" --generate-notes
